<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Terminal intro">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="260" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect width="720" height="36" rx="12" fill="#21262d"/>
  <rect y="18" width="720" height="18" fill="#21262d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="360" y="22" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">crhaxx@brno  zsh</text>

  <!-- lines -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="24" y="68" fill="#3fb950">$</text>
    <text x="42" y="68" fill="#c9d1d9">whoami</text>
    <text x="24" y="94" fill="#58a6ff">’</text>
    <text x="42" y="94" fill="#e6edf3">Nikola Crhák · Backend &amp; Mobile Developer</text>

    <text x="24" y="128" fill="#3fb950">$</text>
    <text x="42" y="128" fill="#c9d1d9">cat ./stack.json</text>
    <text x="24" y="154" fill="#8b949e">{</text>
    <text x="42" y="154" fill="#79c0ff">"langs"</text>
    <text x="110" y="154" fill="#8b949e">:</text>
    <text x="124" y="154" fill="#a5d6ff">["C#", "TypeScript", "Dart", "Python"]</text>
    <text x="24" y="178" fill="#8b949e">}</text>

    <text x="24" y="212" fill="#3fb950">$</text>
    <text x="42" y="212" fill="#c9d1d9">./ship --status</text>
    <text x="24" y="238" fill="#3fb950" filter="url(#glow)"></text>
    <text x="42" y="238" fill="#3fb950">shipping</text>
    <text x="122" y="238" fill="#8b949e">·</text>
    <text x="138" y="238" fill="#58a6ff">always learning</text>
    <text x="280" y="238" fill="#8b949e">·</text>
    <text x="296" y="238" fill="#39d0d8">open to collab</text>

    <!-- blinking cursor -->
    <rect x="430" y="224" width="9" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
